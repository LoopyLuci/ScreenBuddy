name: ScreenBuddy CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --verbose

  # The desktop app is Win32/Direct2D and only builds on Windows. This job builds
  # the portable core crate on Linux, which is what genuinely needs checking
  # there: it catches platform-gating mistakes (a cfg(windows) leak, a stray
  # Win32 type outside a gate) that a Windows-only build can never surface.
  build-core-linux:
    name: Check core on Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Check core crate
        run: cargo check --package screenbuddy-core --all-targets
      - name: Test core crate
        run: cargo test --package screenbuddy-core

  # A second non-Windows target, for the same reason as the Linux job: an
  # unguarded x86-only intrinsic or Win32 type is invisible on a Windows build.
  # macOS also differs in ways that matter here -- Metal instead of Vulkan, and
  # no /sys/devices/system/node for NUMA detection.
  build-core-macos:
    name: Check core on macOS
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check core crate
        run: cargo check --package screenbuddy-core --all-targets
      - name: Test core crate
        run: cargo test --package screenbuddy-core

  build:
    name: Build Release
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --verbose
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenbuddy-windows
          path: target/release/screenbuddy.exe

  package:
    name: Package
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create package
        run: |
          mkdir -p package
          cp target/release/screenbuddy.exe package/
          cp -r assets package/
          cp -r toolkit package/
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: screenbuddy-package
          path: package/
