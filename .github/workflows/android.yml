name: ScreenBuddy Android CI

on:
  push:
    branches: [main]
    paths:
      - 'ScreenBuddy-Android/**'
  pull_request:
    branches: [main]
    paths:
      - 'ScreenBuddy-Android/**'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScreenBuddy-Android
    steps:
      - uses: actions/checkout@v4

      # AGP 8.2.0 is built and tested against JDK 17; JDK 21+ fails its
      # JdkImageTransform (jlink exits 1 with no diagnostic). Keep this pinned.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screenbuddy-android-debug
          path: ScreenBuddy-Android/app/build/outputs/apk/debug/*.apk

  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    needs: build
    # Release signing needs the keystore, which is intentionally not committed.
    # Configure these repository secrets to produce a signed artifact:
    #   SCREENBUDDY_KEYSTORE_B64  (base64 of the .jks)
    #   SCREENBUDDY_STORE_PASSWORD, SCREENBUDDY_KEY_PASSWORD, SCREENBUDDY_KEY_ALIAS
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: ScreenBuddy-Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SCREENBUDDY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SCREENBUDDY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SCREENBUDDY_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCREENBUDDY_KEY_ALIAS }}
        run: |
          # A missing key must fail the job. Exiting 0 here made this job report
          # success while producing no signed artifact at all.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::No signing key configured. Set these repository secrets:"
            echo "::error::  SCREENBUDDY_KEYSTORE_B64 (base64 of the .jks)"
            echo "::error::  SCREENBUDDY_STORE_PASSWORD, SCREENBUDDY_KEY_PASSWORD, SCREENBUDDY_KEY_ALIAS"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > screenbuddy-release.jks
          {
            echo "storeFile=screenbuddy-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify the APK is signed by the release key
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          test -f "$APK" || { echo "::error::No release APK produced"; exit 1; }
          # Locate apksigner rather than assuming a version or ANDROID_HOME.
          APKSIGNER=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" > verify.txt 2>&1 \
            || { echo "::error::APK signature did not verify"; cat verify.txt; exit 1; }
          # Guard against the signed build silently falling back to the debug key.
          if grep -q "Android Debug" verify.txt; then
            echo "::error::APK is debug-signed, not release-signed"
            cat verify.txt
            exit 1
          fi
          grep -E "certificate DN|SHA-256 digest" verify.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: screenbuddy-android-release
          path: ScreenBuddy-Android/app/build/outputs/apk/release/*.apk